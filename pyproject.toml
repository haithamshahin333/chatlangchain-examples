[project]
name = "chat-langchain"
version = "0.1.0"
description = "chat-langchain twice: a LangGraph workflow and a Deep Agent, built to tour LangSmith"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain[mcp]>=1.4.6,<2.0",
    "langchain-core>=1.5.1,<2.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.0,<2.0",
    "deepagents>=0.7.28",
    "langsmith>=0.14.9",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.37",
    "langgraph-sdk",
    "openevals",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_langchain"]
