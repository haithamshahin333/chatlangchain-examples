# The tour around the two agents: evals, smoke tests, provisioning. Not deployed itself.
# Each agent under agents/ is its own package with its own dependencies; this workspace
# installs both into one venv so the evals and scripts can import them.
[project]
name = "chat-langchain-tour"
version = "0.1.0"
description = "chat-langchain twice: a LangGraph workflow and a Deep Agent, built to tour LangSmith"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chat-langchain-workflow",
    "chat-langchain-deepagent",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.37",
    "langgraph-sdk",
    "openevals",
]

[tool.uv.workspace]
members = ["agents/workflow", "agents/deepagent"]

[tool.uv.sources]
chat-langchain-workflow = { workspace = true }
chat-langchain-deepagent = { workspace = true }
