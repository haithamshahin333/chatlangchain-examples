[project]
name = "chat-langchain-workflow"
version = "0.1.0"
description = "chat-langchain as a fixed LangGraph workflow: classify -> refuse | retrieve -> respond"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain[mcp]>=1.4.6,<2.0",
    "langchain-core>=1.5.1,<2.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_langchain_workflow"]
